# CyberPhunk signature: neon cyan → magenta gradient on the active window.
# This file overrides Omarchy's default hyprland.conf.tpl (theme-dir override,
# same pattern retro-82/kanagawa/lumon use). Solid colors use rgb(); gradients
# take raw rgba() with alpha.
$activeBorderColor = rgba(22e4ffee) rgba(ff6bd6ee) 45deg
$inactiveBorderColor = rgba(1e325099)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
